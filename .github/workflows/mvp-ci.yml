name: MVP CI

on:
  pull_request:
    branches: [develop, main]

jobs:
  backend-regression:
    name: Backend regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Run target regression
        run: >-
          pytest
          tests/test_agents/test_incident_graph_e2e.py
          tests/test_prompts/test_reporting.py
          tests/test_prompts/test_video_analysis.py
          tests/test_services/test_video_memory.py
          -q

  frontend-quality:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
